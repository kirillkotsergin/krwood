name: Deploy to Radicenter (manual fallback)

# Primary deployment is now `npm run deploy` (scripts/deploy.sh) straight over
# SSH from a developer machine. This workflow is kept as a fallback for
# deploying when you are away from your usual machine.
#
# It is MANUAL ONLY — it no longer runs on push, so it cannot fail a commit.
# To re-enable automatic deploys, restore the trigger below:
#
#   on:
#     push:
#       branches: [main]
#
# It also requires these repository secrets, which are not currently set:
#   SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, DEPLOY_PATH
#   (optional: SSH_PORT, SSH_KNOWN_HOSTS)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run rsync in --dry-run mode (nothing is written to the server)'
        type: boolean
        default: false

# Never let two deployments write to the document root at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build if a translation key is missing in any locale,
      # or if any .astro/.ts file has a type error.
      - name: Type-check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html          || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/en/index.html       || { echo "::error::dist/en/index.html missing"; exit 1; }
          test -f dist/pl/index.html       || { echo "::error::dist/pl/index.html missing"; exit 1; }
          test -f dist/it/index.html       || { echo "::error::dist/it/index.html missing"; exit 1; }
          test -f dist/contact.php         || { echo "::error::dist/contact.php missing"; exit 1; }
          test -f dist/.htaccess           || { echo "::error::dist/.htaccess missing"; exit 1; }
          echo "Build output verified. Size: $(du -sh dist | cut -f1)"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            # Preferred: pinned host key supplied as a secret.
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            # Fallback: trust-on-first-use. Set the SSH_KNOWN_HOSTS secret to
            # remove this window by pinning the key instead.
            echo "::warning::SSH_KNOWN_HOSTS is not set - falling back to ssh-keyscan."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server via rsync
        run: |
          set -euo pipefail

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "::notice::Dry run - no files will be written to the server."
          fi

          rsync \
            --recursive \
            --links \
            --times \
            --compress \
            --delete \
            --human-readable \
            --stats \
            --chmod=D755,F644 \
            $DRY_RUN_FLAG \
            --exclude '.well-known/' \
            --exclude '.git/' \
            --exclude 'cgi-bin/' \
            --exclude 'error_log' \
            --exclude '.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: Smoke-test the live site
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          failed=0

          for path in "/" "/en/" "/pl/" "/it/" "/privacy/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "https://krwood.ee${path}")
            if [ "$code" = "200" ]; then
              echo "OK   ${path} -> ${code}"
            else
              echo "::error::FAIL ${path} -> ${code}"
              failed=1
            fi
          done

          exit $failed

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
