<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="KR Wood — premium wood pellets">
  <title>KR Wood — premium wood pellets</title>

  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2219"/>
      <stop offset="55%" stop-color="#163d2d"/>
      <stop offset="100%" stop-color="#1c5c41"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab871"/>
      <stop offset="100%" stop-color="#d98127"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#d98127" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d98127" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#ogAccent)"/>

  <!-- Logo mark -->
  <rect x="80" y="78" width="72" height="72" rx="18" fill="#22734f"/>
  <path d="M116 92l14.4 21.1h-7.2l12.4 18.5h-9.3l12.5 18.6H99.2l12.5-18.6h-9.3l12.4-18.5h-7.2Z" fill="#f2d5a7"/>

  <text x="172" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">
    KR<tspan fill="#eab871"> Wood</tspan>
  </text>

  <!-- Headline -->
  <text x="80" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Premium Wood Pellets</text>
  <text x="80" y="378" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#ogAccent)">ENplus® A1 certified</text>

  <!-- Key figures -->
  <text x="80" y="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#c9dbd1">
    4.9+ kWh/kg  ·  &#60; 0.5 % ash  ·  6 mm &#38; 8 mm  ·  krwood.ee
  </text>

  <!-- Decorative pellets -->
  <g fill="#eab871" opacity="0.9">
    <rect x="940" y="452" width="34" height="88" rx="17" opacity="0.85"/>
    <rect x="990" y="424" width="34" height="116" rx="17" opacity="0.65"/>
    <rect x="1040" y="470" width="34" height="70" rx="17" opacity="0.5"/>
    <rect x="1090" y="440" width="34" height="100" rx="17" opacity="0.35"/>
  </g>
</svg>
